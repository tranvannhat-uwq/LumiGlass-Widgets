name: Android CI & Release APK

on:
  push:
    branches: [ "main" ]
    tags: [ "v*" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Normalize gradle.properties for Linux CI
        run: |
          sed -i '/org.gradle.java.home/d' gradle.properties
          chmod +x gradlew

      - name: Run Unit Tests & Assemble APK
        run: ./gradlew testDebugUnitTest assembleRelease assembleDebug --no-daemon

      - name: Prepare Release APKs
        run: |
          mkdir -p dist
          TAG_NAME="${{ github.ref_name }}"
          if [ -z "$TAG_NAME" ]; then TAG_NAME="latest"; fi
          cp app/build/outputs/apk/release/app-release.apk "dist/LumiGlass-Widgets-${TAG_NAME}.apk" 2>/dev/null || true
          cp app/build/outputs/apk/release/app-release.apk "dist/LumiGlass-Widgets.apk" 2>/dev/null || true
          cp app/build/outputs/apk/debug/app-debug.apk "dist/app-debug.apk" 2>/dev/null || true

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: LumiGlass-Widgets-APK
          path: dist/

      - name: Publish GitHub Release on Tag
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
